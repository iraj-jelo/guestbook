name: CI

on:
  workflow_call:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
      - 'diagram.png'
      - 'screenshot.png'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
      - 'diagram.png'
      - 'screenshot.png'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python || steps.full.outputs.python }}
      container: ${{ steps.filter.outputs.container || steps.full.outputs.container }}
      manifests: ${{ steps.filter.outputs.manifests || steps.full.outputs.manifests }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'python-redis/**'
              - '.github/workflows/**'
            container:
              - 'python-redis/**'
              - '.github/workflows/**'
            manifests:
              - 'manifests/**'
              - '.github/workflows/**'

      - name: Run all checks for manual and release runs
        id: full
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: |
          echo "python=true" >> "$GITHUB_OUTPUT"
          echo "container=true" >> "$GITHUB_OUTPUT"
          echo "manifests=true" >> "$GITHUB_OUTPUT"

  python:
    name: Python checks
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: python-redis
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        working-directory: python-redis
        run: python -m compileall -q .

      - name: Run application tests
        working-directory: python-redis
        run: python -m pytest

  container:
    name: Build frontend image
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./python-redis
          file: ./python-redis/Dockerfile
          target: runtime
          push: false

  manifests:
    name: Validate ${{ matrix.environment }} manifests
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.3.1'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          # Pin to a recent kubectl so bundled kustomize is recent and compatible with Helm v3
          version: 'v1.37.1'

      - name: Debug (print tool versions)
        run: |
          echo "--- tool versions ---"
          echo "kubectl:"; kubectl version --client || true
          echo "helm:"; helm version --short || true
          echo "kubectl kustomize availability:"; kubectl kustomize --help >/dev/null 2>&1 && echo "available" || echo "not available"

      - name: Lint Helm chart
        run: helm lint ./manifests/guestbookchart --values ./manifests/guestbookchart/values-${{ matrix.environment }}.yaml

      - name: Render Helm chart
        run: helm template guestbook ./manifests/guestbookchart --namespace guestbook-${{ matrix.environment }} --values ./manifests/guestbookchart/values-${{ matrix.environment }}.yaml

      - name: Build Kustomize overlay
        run: kubectl kustomize ./manifests/kustomize/overlays/${{ matrix.environment }}

      - name: Build Helm-backed Kustomize overlay
        run: kubectl kustomize --enable-helm --load-restrictor LoadRestrictionsNone ./manifests/helm-kustomize/overlays/${{ matrix.environment }}
