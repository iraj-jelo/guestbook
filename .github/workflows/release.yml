name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example, v1.1.0)
        required: false
        type: string
      build_image:
        description: Optional Docker image reference to use instead of building and pushing a new image
        required: false
        default: true
        type: boolean
      run_ci:
        description: Whether to call the CI workflow
        required: false
        default: true
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  validate:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_ci }}
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: Build and sign release image
    needs: validate
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: debug inputs and outputs
        env:
          image_input: ${{ inputs.build_image }}
          tag_input: ${{ inputs.tag }}
          digest: ${{ steps.build.outputs.digest }}
          image: ${{ steps.image.outputs.name }}
          tag: ${{ steps.release.outputs.tag }}
          version: ${{ steps.release.outputs.version }}
        run: |
          echo "--- tag_input=${tag_input} ---"
          echo "--- digest=${digest} ---"
          echo "--- image=${image} ---"
          echo "--- tag=${tag} ---"
          echo "-- version=${version} ---"

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Docker Buildx
        if: ${{ inputs.build_image }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.build_image }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        if: ${{ inputs.build_image }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./python-redis
          file: ./python-redis/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        if: ${{ inputs.build_image }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        if: ${{ inputs.build_image }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  update-manifests:
    name: Propose versioned manifest update
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update frontend image references
        env:
          IMAGE: irajjelodari/guestbook
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          ESCAPED_IMAGE=$(echo "$IMAGE" | sed 's/\//\\\//g')
          sed -E  's/(${ESCAPED_IMAGE}):[0-9]+.[0-9]+.[0-9]+/\1:${VERSION}/g' -i "manifests/helm-kustomize/base/guestbookchart/values.yaml"
          sed -E  's/(${ESCAPED_IMAGE}):[0-9]+.[0-9]+.[0-9]+/\1:${VERSION}/g' -i "manifests/kustomize/base/frontend-deployment.yaml"
          sed -E  's/(${ESCAPED_IMAGE}):[0-9]+.[0-9]+.[0-9]+/\1:${VERSION}/g' -i "manifests/guestbookchart/values.yaml"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.3.1'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.37.1'

      - name: Validate updated manifests
        run: |
          for environment in dev staging prod; do
            helm lint ./manifests/guestbookchart --values "./manifests/guestbookchart/values-${environment}.yaml"
            helm template guestbook ./manifests/guestbookchart --namespace "guestbook-${environment}" --values "./manifests/guestbookchart/values-${environment}.yaml"
            kubectl kustomize "./manifests/kustomize/overlays/${environment}"
            kubectl kustomize --enable-helm --load-restrictor LoadRestrictionsNone "./manifests/helm-kustomize/overlays/${environment}"
          done

      - name: Create manifest update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: automation/release-image-${{ needs.publish.outputs.tag }}
          commit-message: "Update Guestbook image to ${{ needs.publish.outputs.tag }}"
          title: "Update Guestbook image to ${{ needs.publish.outputs.tag }}"
          body: |
            Update all frontend deployment manifests to the image built for release `${{ needs.publish.outputs.tag }}`.

            Image: `${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.version }}`

            The release workflow generated BuildKit provenance and an SBOM, and signed the image digest with Cosign keyless signing.
          add-paths: |
            manifests/kustomize/base/frontend-deployment.yaml
            manifests/guestbookchart/values.yaml
            manifests/helm-kustomize/base/guestbookchart/values.yaml
