name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  validate:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and sign release image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: echo "name=irajjelodari/guestbook" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./python-redis
          file: ./python-redis/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  update-manifests:
    name: Propose digest-pinned manifest update
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update frontend image references
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          image = os.environ["IMAGE"]
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"Invalid image digest: {digest}")

          replacement = f"{image}@{digest}"
          paths = (
              Path("manifests/kustomize/base/frontend-deployment.yaml"),
              Path("manifests/guestbookchart/values.yaml"),
              Path("manifests/helm-kustomize/base/guestbookchart/values.yaml"),
          )
          for path in paths:
              content = path.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r"irajjelodari/guestbook(?::[^\s\"']+|@sha256:[0-9a-f]{64})",
                  replacement,
                  content,
              )
              if count != 1:
                  raise SystemExit(f"Expected one frontend image in {path}, found {count}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.3.1'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.37.1'

      - name: Validate updated manifests
        run: |
          for environment in dev staging prod; do
            helm lint ./manifests/guestbookchart --values "./manifests/guestbookchart/values-${environment}.yaml"
            helm template guestbook ./manifests/guestbookchart --namespace "guestbook-${environment}" --values "./manifests/guestbookchart/values-${environment}.yaml"
            kubectl kustomize "./manifests/kustomize/overlays/${environment}"
            kubectl kustomize --enable-helm --load-restrictor LoadRestrictionsNone "./manifests/helm-kustomize/overlays/${environment}"
          done

      - name: Create manifest update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: automation/release-image-${{ github.event.release.tag_name }}
          commit-message: "Update Guestbook image to ${{ github.event.release.tag_name }}"
          title: "Update Guestbook image to ${{ github.event.release.tag_name }}"
          body: |
            Update all frontend deployment manifests to the image built for release `${{ github.event.release.tag_name }}`.

            Image: `${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}`

            The release workflow generated BuildKit provenance and an SBOM, and signed this digest with Cosign keyless signing.
          add-paths: |
            manifests/kustomize/base/frontend-deployment.yaml
            manifests/guestbookchart/values.yaml
            manifests/helm-kustomize/base/guestbookchart/values.yaml
