apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -prod
namespace: guestbook-prod
resources:
  - ../../base
helmGlobals:
  chartHome: ../../base
helmCharts:
- name: guestbookchart
  releaseName: guestbook-prod
  namespace: guestbook-prod
  valuesFile: values-prod.yaml # prod/values-prod.yaml
