apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: guestbook
    tier: frontend
spec:
  type: {{ .Values.frontend.serviceType }}
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  selector:
    app: guestbook
    tier: frontend
