apiVersion: v1
kind: Service
metadata:
  name: redis-follower
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
    role: follower
    tier: backend
spec:
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
  selector:
    app: redis
    role: follower
    tier: backend
