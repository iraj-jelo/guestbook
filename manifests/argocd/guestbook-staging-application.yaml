apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iraj-jelo/guestbook.git
    targetRevision: main
    path: helm-kustomize/overlays/staging
    kustomize:
      enableHelm: true
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-staging